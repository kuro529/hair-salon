<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>美容室ゲーム</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: #ffe9f0; font-family: -apple-system, "Hiragino Sans", sans-serif; color: #4a3340; overscroll-behavior: none; }
#app { max-width: 420px; margin: 0 auto; padding: 10px 12px 20px; }
#top { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 15px; padding: 4px 4px 8px; }
#order { background: #fff; border-radius: 16px; padding: 10px 14px; font-size: 14px; line-height: 1.55; box-shadow: 0 2px 6px rgba(200,120,150,.25); }
#order b { color: #e0457b; }
#order .dim { opacity: .35; }
#hint { font-size: 13px; font-weight: bold; text-align: center; margin-top: 8px; }
#stage { position: relative; margin-top: 8px; }
canvas { display: block; width: 100%; border-radius: 18px; background: #fff; touch-action: none; box-shadow: 0 2px 6px rgba(200,120,150,.25); }
.btns { display: flex; gap: 10px; margin-top: 12px; }
.hide { display: none; }
button { flex: 1; border: none; border-radius: 14px; padding: 14px 0; font-size: 16px; font-weight: bold; font-family: inherit; color: #fff; background: #e0457b; }
button.sub { background: #b9a3ad; }
button.tool { background: #fff; color: #4a3340; border: 3px solid #e6cdd6; padding: 11px 0; }
button.tool.on { border-color: #e0457b; background: #ffe1ea; }
button:disabled { opacity: .4; }
#result { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(255,233,240,.82); border-radius: 18px; }
#result.show { display: flex; }
#card { background: #fff; border-radius: 18px; padding: 20px 22px; text-align: center; width: 78%; box-shadow: 0 4px 14px rgba(200,120,150,.4); }
#stars { font-size: 40px; letter-spacing: 4px; }
#score { font-size: 22px; font-weight: bold; margin: 6px 0 2px; }
#detail { font-size: 13px; margin-bottom: 6px; }
#comment { font-size: 15px; margin-bottom: 14px; }
#card button { width: 100%; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span id="count">お客さん 1人目</span>
    <span id="total">⭐ 0</span>
  </div>
  <div id="order"></div>
  <div id="hint"></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="result">
      <div id="card">
        <div id="stars"></div>
        <div id="score"></div>
        <div id="detail"></div>
        <div id="comment"></div>
        <button id="nextBtn">次のお客さん</button>
      </div>
    </div>
  </div>
  <div id="btnsCut" class="btns">
    <button id="retryBtn" class="sub">やり直し(あと1回)</button>
    <button id="cutDoneBtn">カット完了 ▶</button>
  </div>
  <div id="btnsSet" class="btns hide">
    <button id="curlBtn" class="tool on">🌀 コテ</button>
    <button id="ironBtn" class="tool">➖ アイロン</button>
    <button id="doneBtn">完成!</button>
  </div>
</div>

<script>
const W = 360, H = 460, COL_W = 4, BIN = 10, BINS = 47;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const dpr = window.devicePixelRatio || 1;
cv.width = W * dpr;
cv.height = H * dpr;
ctx.scale(dpr, dpr);

const LEVELS = [
  { label: '眉の上', y: 150 },
  { label: '眉の下', y: 170 }
];
const SIDES = [
  { label: 'あごのライン', y: 255 },
  { label: '肩まで', y: 300 },
  { label: '胸のあたり', y: 350 }
];
const SETS = [
  { label: 'ストレート(くせを全部のばす)', fn: function () { return 0; } },
  { label: '毛先だけ巻く(下のほうだけ)', fn: function (c, y) { return y > c.bottom - 60 ? 1 : 0; } },
  { label: '全体を巻く(目の高さから下ぜんぶ)', fn: function (c, y) { return y > 180 ? 1 : 0; } }
];
const HAIR_COLORS = ['#3b2a20', '#1f1f24', '#7a4a2a', '#c9a04a', '#8a3b3b'];
const SKIN_COLORS = ['#ffe0c4', '#f6cfa8', '#e8b88f'];

let cols = [], initial = [], pieces = [];
let hairColor, skinColor, bangs, sides, setOrder;
let customer = 0, totalStars = 0, retryLeft = 1, mood = 0;
let phase = 'cut', tool = 'curl', cutScore = 0;
let pointer = null;

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function makeBangs() {
  const type = Math.floor(Math.random() * 4);
  const lv = pick(LEVELS);
  if (type === 0) {
    return { text: lv.label + 'でぱっつん(まっすぐ)', fn: function () { return lv.y; } };
  }
  if (type === 1) {
    const dir = Math.random() < 0.5 ? 1 : -1;
    const from = dir > 0 ? '左' : '右', to = dir > 0 ? '右' : '左';
    return {
      text: 'ななめ。画面の' + from + '端は' + lv.label + '、' + to + 'にいくほど長く',
      fn: function (dx) { return lv.y + (dir * dx + 58) / 116 * 24; }
    };
  }
  if (type === 2) {
    return {
      text: 'ラウンド。真ん中は' + lv.label + '、端にいくほど丸く長く',
      fn: function (dx) { return lv.y + (dx / 58) * (dx / 58) * 24; }
    };
  }
  return {
    text: 'センター分け。真ん中はおでこを出して、端は目の横まで',
    fn: function (dx) { return 122 + Math.abs(dx) / 58 * 63; }
  };
}

function newCustomer() {
  customer++;
  hairColor = pick(HAIR_COLORS);
  skinColor = pick(SKIN_COLORS);
  bangs = makeBangs();
  sides = pick(SIDES);
  setOrder = pick(SETS);
  const seed = Math.random() * 10;
  cols = [];
  let i = 0;
  for (let x = 88; x < 272; x += COL_W) {
    const cx = x + COL_W / 2;
    const dx = cx - 180;
    const top = 165 - 100 * Math.sqrt(1 - (dx / 92) * (dx / 92));
    const front = Math.abs(dx) < 58;
    const bottom = front ? 205 + Math.random() * 25 : 390 + Math.random() * 30;
    const curl = [];
    for (let b = 0; b < BINS; b++) {
      curl.push(front ? 0 : 0.4 + 0.3 * Math.sin(b * 1.3 + i * 0.5 + seed));
    }
    cols.push({ x: x, cx: cx, dx: dx, top: top, bottom: bottom, front: front, curl: curl });
    i++;
  }
  initial = cols.map(function (c) { return c.bottom; });
  pieces = [];
  retryLeft = 1;
  mood = 0;
  phase = 'cut';
  tool = 'curl';
  document.getElementById('count').textContent = 'お客さん ' + customer + '人目';
  document.getElementById('result').classList.remove('show');
  updateUI();
}

function updateUI() {
  const cutDim = phase === 'cut' ? '' : ' class="dim"';
  const setDim = phase === 'cut' ? ' class="dim"' : '';
  document.getElementById('order').innerHTML =
    '<div' + cutDim + '>✂️ 前髪:<b>' + bangs.text + '</b></div>' +
    '<div' + cutDim + '>✂️ サイド:<b>' + sides.label + '</b></div>' +
    '<div' + setDim + '>🌀 セット:<b>' + setOrder.label + '</b></div>';
  document.getElementById('hint').textContent =
    phase === 'cut' ? '指でなぞって髪を切ろう' :
    phase === 'set' ? '道具を選んでサイドの髪をなぞろう' : '';
  document.getElementById('btnsCut').classList.toggle('hide', phase !== 'cut');
  document.getElementById('btnsSet').classList.toggle('hide', phase === 'cut');
  const r = document.getElementById('retryBtn');
  r.textContent = 'やり直し(あと' + retryLeft + '回)';
  r.disabled = retryLeft <= 0;
  document.getElementById('curlBtn').classList.toggle('on', tool === 'curl');
  document.getElementById('ironBtn').classList.toggle('on', tool === 'iron');
  document.getElementById('doneBtn').disabled = phase !== 'set';
}

function cutSegment(x0, y0, x1, y1) {
  const minX = Math.min(x0, x1) - COL_W / 2;
  const maxX = Math.max(x0, x1) + COL_W / 2;
  for (const c of cols) {
    if (c.cx < minX || c.cx > maxX) continue;
    let t = x1 === x0 ? 1 : (c.cx - x0) / (x1 - x0);
    t = Math.max(0, Math.min(1, t));
    const y = y0 + t * (y1 - y0);
    if (y > c.top + 10 && y < c.bottom) {
      pieces.push({ x: c.x, y: y, h: c.bottom - y, vy: 1 + Math.random() * 2, vx: (Math.random() - 0.5) * 1.5 });
      c.bottom = y;
    }
  }
}

function applyTool(x, y) {
  const v = tool === 'curl' ? 1 : 0;
  const b0 = Math.floor((y - 8) / BIN), b1 = Math.floor((y + 8) / BIN);
  for (const c of cols) {
    if (c.front || Math.abs(c.cx - x) > 10) continue;
    for (let b = b0; b <= b1; b++) {
      if (b >= 0 && b < BINS) c.curl[b] = v;
    }
  }
}

function toolSegment(x0, y0, x1, y1) {
  const dist = Math.hypot(x1 - x0, y1 - y0);
  const steps = Math.max(1, Math.ceil(dist / 6));
  for (let s = 0; s <= steps; s++) {
    const t = s / steps;
    applyTool(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t);
  }
}

function getPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}

cv.addEventListener('pointerdown', function (e) {
  if (phase === 'result') return;
  pointer = getPos(e);
  cv.setPointerCapture(e.pointerId);
  if (phase === 'set') applyTool(pointer.x, pointer.y);
});
cv.addEventListener('pointermove', function (e) {
  if (phase === 'result' || !pointer) return;
  const p = getPos(e);
  if (phase === 'cut') cutSegment(pointer.x, pointer.y, p.x, p.y);
  else toolSegment(pointer.x, pointer.y, p.x, p.y);
  pointer = p;
});
function endPointer() { pointer = null; }
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);

function calcCutScore() {
  let sum = 0;
  for (const c of cols) {
    const target = c.front ? bangs.fn(c.dx) : sides.y;
    const diff = c.bottom - target;
    let err = diff >= 0 ? diff : -diff * 1.5;
    err = Math.max(0, err - 5);
    sum += err;
  }
  return Math.round(Math.max(0, 100 - (sum / cols.length) * 3));
}

function calcSetScore() {
  let sum = 0, n = 0;
  for (const c of cols) {
    if (c.front) continue;
    for (let b = 0; b < BINS; b++) {
      const y = b * BIN + BIN / 2;
      if (y < c.top || y > c.bottom) continue;
      let err = Math.abs(c.curl[b] - setOrder.fn(c, y));
      if (err < 0.15) err = 0;
      sum += err;
      n++;
    }
  }
  if (n === 0) return 0;
  return Math.round(Math.max(0, 100 - (sum / n) * 200));
}

function cutDone() {
  if (phase !== 'cut') return;
  cutScore = calcCutScore();
  phase = 'set';
  pointer = null;
  updateUI();
}

function finish() {
  if (phase !== 'set') return;
  const setScore = calcSetScore();
  const score = Math.round((cutScore + setScore) / 2);
  const stars = score >= 80 ? 3 : score >= 55 ? 2 : 1;
  totalStars += stars;
  phase = 'result';
  mood = stars >= 2 ? 1 : -1;
  document.getElementById('stars').textContent = '⭐'.repeat(stars);
  document.getElementById('score').textContent = score + '点';
  document.getElementById('detail').textContent = 'カット ' + cutScore + '点 / セット ' + setScore + '点';
  document.getElementById('comment').textContent =
    stars === 3 ? 'カンペキ!ありがとう!' : stars === 2 ? 'いい感じ!また来ます' : 'うーん…ちょっと違うかも';
  document.getElementById('total').textContent = '⭐ ' + totalStars;
  document.getElementById('result').classList.add('show');
  updateUI();
}

function retry() {
  if (phase !== 'cut' || retryLeft <= 0) return;
  retryLeft--;
  cols.forEach(function (c, i) { c.bottom = initial[i]; });
  pieces = [];
  updateUI();
}

document.getElementById('cutDoneBtn').addEventListener('click', cutDone);
document.getElementById('doneBtn').addEventListener('click', finish);
document.getElementById('retryBtn').addEventListener('click', retry);
document.getElementById('nextBtn').addEventListener('click', newCustomer);
document.getElementById('curlBtn').addEventListener('click', function () { tool = 'curl'; updateUI(); });
document.getElementById('ironBtn').addEventListener('click', function () { tool = 'iron'; updateUI(); });

function drawPerson() {
  // ケープ
  ctx.fillStyle = '#cfe6f5';
  ctx.beginPath();
  ctx.moveTo(150, 270);
  ctx.quadraticCurveTo(40, 300, 20, H);
  ctx.lineTo(340, H);
  ctx.quadraticCurveTo(320, 300, 210, 270);
  ctx.closePath();
  ctx.fill();
  // 首
  ctx.fillStyle = skinColor;
  ctx.fillRect(163, 235, 34, 50);
  // 顔
  ctx.beginPath();
  ctx.ellipse(180, 170, 70, 85, 0, 0, Math.PI * 2);
  ctx.fill();
  // 眉
  ctx.strokeStyle = '#5a4036';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(140, 162); ctx.lineTo(164, 160);
  ctx.moveTo(196, 160); ctx.lineTo(220, 162);
  ctx.stroke();
  // 目
  ctx.fillStyle = '#3a2a2a';
  ctx.beginPath();
  ctx.arc(152, 180, 6, 0, Math.PI * 2);
  ctx.arc(208, 180, 6, 0, Math.PI * 2);
  ctx.fill();
  // ほっぺ
  ctx.fillStyle = 'rgba(255,140,160,.35)';
  ctx.beginPath();
  ctx.arc(135, 205, 11, 0, Math.PI * 2);
  ctx.arc(225, 205, 11, 0, Math.PI * 2);
  ctx.fill();
  // 口
  ctx.strokeStyle = '#c0506a';
  ctx.lineWidth = 3;
  ctx.beginPath();
  if (mood > 0) ctx.arc(180, 212, 16, 0.15 * Math.PI, 0.85 * Math.PI);
  else if (mood < 0) ctx.arc(180, 232, 14, 1.2 * Math.PI, 1.8 * Math.PI);
  else ctx.arc(180, 214, 10, 0.2 * Math.PI, 0.8 * Math.PI);
  ctx.stroke();
}

function curlAt(c, y) {
  const f = y / BIN - 0.5;
  let i = Math.floor(f);
  const t = f - i;
  const a = c.curl[Math.max(0, Math.min(BINS - 1, i))];
  const b = c.curl[Math.max(0, Math.min(BINS - 1, i + 1))];
  return a + (b - a) * t;
}

function sidePath(c) {
  const dir = c.dx < 0 ? -1 : 1;
  ctx.beginPath();
  let y = c.top;
  while (true) {
    const yy = Math.min(y, c.bottom);
    const x = c.cx + curlAt(c, yy) * 6 * Math.sin(yy * 0.12) * dir;
    if (y === c.top) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
    if (yy >= c.bottom) break;
    y += 4;
  }
}

function drawHair() {
  ctx.lineCap = 'butt';
  ctx.lineJoin = 'round';
  ctx.lineWidth = COL_W + 0.8;
  cols.forEach(function (c, i) {
    if (c.front) {
      ctx.fillStyle = hairColor;
      ctx.fillRect(c.x, c.top, COL_W + 0.5, c.bottom - c.top);
      if (i % 2 === 0) {
        ctx.fillStyle = 'rgba(255,255,255,.08)';
        ctx.fillRect(c.x, c.top, COL_W, c.bottom - c.top);
      }
    } else {
      sidePath(c);
      ctx.strokeStyle = hairColor;
      ctx.stroke();
      if (i % 2 === 0) {
        ctx.strokeStyle = 'rgba(255,255,255,.08)';
        ctx.stroke();
      }
    }
  });
}

function drawPieces() {
  ctx.fillStyle = hairColor;
  for (const p of pieces) {
    p.vy += 0.35;
    p.y += p.vy;
    p.x += p.vx;
    ctx.fillRect(p.x, p.y, COL_W, p.h);
  }
  pieces = pieces.filter(function (p) { return p.y < H + 10; });
}

function loop() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fff6f9';
  ctx.fillRect(0, 0, W, H);
  drawPerson();
  drawHair();
  drawPieces();
  if (pointer && phase !== 'result') {
    ctx.font = '28px sans-serif';
    const icon = phase === 'cut' ? '✂️' : tool === 'curl' ? '🌀' : '➖';
    ctx.fillText(icon, pointer.x - 14, pointer.y - 18);
  }
  requestAnimationFrame(loop);
}

newCustomer();
loop();
</script>
</body>
</html>
